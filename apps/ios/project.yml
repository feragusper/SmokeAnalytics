# XcodeGen spec for the iOS app. Regenerate the .xcodeproj with:  xcodegen generate
# (install once with:  brew install xcodegen)
#
# Prerequisites before the project builds/runs:
#   1. Assemble the shared framework:  ./gradlew :libraries:shared:assembleSharedDebugXCFramework
#   2. Provide the Firebase configs (secrets, gitignored):
#        apps/ios/Firebase/Staging/GoogleService-Info.plist      (Debug)
#        apps/ios/Firebase/Production/GoogleService-Info.plist   (Release)
#   3. Install the iOS simulator runtime:  xcodebuild -downloadPlatform iOS
#
# Debug builds target the STAGING Firebase project (bundle .staging); Release targets PROD.
name: SmokeAnalytics
options:
  bundleIdPrefix: com.feragusper.smokeanalytics
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  # GitLive's iOS klibs link against the native Firebase Apple SDK, which the app provides via SPM.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
  # Native Google Sign-In flow; the resulting token becomes a FirebaseAuth Google credential.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

targets:
  SmokeAnalytics:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      # Static XCFramework produced by :libraries:shared. Debug slice for local dev.
      - framework: ../../libraries/shared/build/XCFrameworks/debug/Shared.xcframework
        embed: false
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        # Google Sign-In redirects back via the env's REVERSED_CLIENT_ID, injected per build config.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    # Copy the environment's GoogleService-Info.plist into the app bundle at build time.
    postCompileScripts:
      - name: "Embed GoogleService-Info.plist ($(FIREBASE_ENV))"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${SRCROOT}/Firebase/${FIREBASE_ENV}/GoogleService-Info.plist"
          if [ ! -f "$SRC" ]; then
            echo "error: missing $SRC (see project.yml prerequisites)"; exit 1
          fi
          cp "$SRC" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The shared framework ships arm64 slices only (device + Apple-Silicon simulator).
        # Exclude the legacy x86_64 simulator arch so the linker picks the arm64 sim slice.
        # Tradeoff: won't run on an Intel Mac's simulator — add an iosX64 target if that's needed.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ONLY_ACTIVE_ARCH: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.feragusper.smokeanalytics.staging
          FIREBASE_ENV: Staging
          GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.1016019974225-p3juqn3f719ce6aepj5ovm3b2o3or1o9
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.feragusper.smokeanalytics
          FIREBASE_ENV: Production
          GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.235081091876-n36u44dgdmdqnb8ce5uh0l506qrd6uss
